function fareCurrent(d){ if(d<=0)return 0; if(d<=6)return 3; return 3+Math.ceil((d-6)/10); }
function fareP1(d){
  if(d<=0)return 0;
  const steps=[4,4,4,7,7,7,10,10,10];
  let dist=4,price=3;
  if(d<=dist)return price;
  for(const s of steps){dist+=s;price++;if(d<=dist)return price;}
  return price+Math.ceil((d-67)/15);
}
function fareP2(d){
  if(d<=0)return 0;
  const steps=[6,8,8,10,10,12,12];
  let dist=6,price=4;
  if(d<=dist)return price;
  for(const s of steps){dist+=s;price++;if(d<=dist)return price;}

}

/* ---- 建图：节点=站名，边=同线相邻站，权重=均分里程差 ---- */
const adj={};
LINES.forEach(L=>{
  const n=L.stations.length;
  L.miles=L.stations.map((_,i)=>L.length*(n<=1?0:i/(n-1)));
  for(let i=1;i<n;i++){
    const a=L.stations[i-1],b=L.stations[i],w=Math.abs(L.miles[i]-L.miles[i-1]);
    (adj[a]=adj[a]||[]).push({to:b,w});
    (adj[b]=adj[b]||[]).push({to:a,w});
  }
});
function shortest(a,b){
  if(a===b)return 0;
  const dist={},visited={},pq=[[0,a]];
  dist[a]=0;
  while(pq.length){
    pq.sort((x,y)=>x[0]-y[0]);
    const [d,u]=pq.shift();
    if(visited[u])continue;
    visited[u]=true;
    if(u===b)return d;
    (adj[u]||[]).forEach(e=>{
      const nd=d+e.w;
      if(nd<(dist[e.to]??Infinity)){dist[e.to]=nd;pq.push([nd,e.to]);}
    });
  }
  return null;
}

function findRange(d){for(const r of TABLE){const[lo,hi]=r[0].split('-').map(Number);if(d>=lo&&d<=hi)return r[0];}return '—';}

/* ================= UI ================= */
function setTab(t){
  document.getElementById('tabStation').classList.toggle('on',t==='station');
  document.getElementById('tabDist').classList.toggle('on',t==='dist');
  document.getElementById('panelStation').classList.toggle('hidden',t!=='station');
  document.getElementById('panelDist').classList.toggle('hidden',t!=='dist');
}
function fillLineOptions(){
  ['A','B'].forEach(w=>{
    const sel=document.getElementById('line'+w);
    LINES.forEach(L=>{const o=document.createElement('option');o.value=L.name;o.textContent=L.name;sel.appendChild(o);});
  });
}
function fillStations(w){
  const lineSel=document.getElementById('line'+w),stnSel=document.getElementById('stn'+w);
  const L=LINES.find(x=>x.name===lineSel.value);
  stnSel.innerHTML='';
  if(!L)return;
  const seen=new Set();
  L.stations.forEach(s=>{
    if(seen.has(s))return;seen.add(s);
    const o=document.createElement('option');o.value=s;o.textContent=s;stnSel.appendChild(o);
  });
}
function setStation(w,stn){
  const L=LINES.find(x=>x.stations.includes(stn));
  if(!L)return;
  document.getElementById('line'+w).value=L.name;
  fillStations(w);
  document.getElementById('stn'+w).value=stn;
}
function swap(){
  const a=document.getElementById('stnA').value,b=document.getElementById('stnB').value;
  setStation('A',b);setStation('B',a);compute();
}
function loadOD(a,b){setStation('A',a);setStation('B',b);compute();}

function compute(){
  const a=document.getElementById('stnA').value,b=document.getElementById('stnB').value;
  if(!a||!b)return;
  if(a===b){render(0,a+' → '+b,'站点估算');return;}
  const d=shortest(a,b);
  if(d===null){document.getElementById('resCard').classList.remove('hidden');
    document.getElementById('resBody').innerHTML='<p style="color:#dc2626">未找到连通路径</p>';return;}
  render(d,a+' → '+b,'站点估算');
}
function computeByDist(){
  const d=parseFloat(document.getElementById('distInput').value);
  if(!(d>0)){alert('请输入有效里程');return;}
  render(d,'按里程 '+d+' km','精确对照附件1');
}

function fmt(n){return (Math.round(n*100)/100).toString();}
function render(d,title,tag){
  const f0=fareCurrent(d),f1=fareP1(d),f2=fareP2(d);
  const max=Math.max(f0,f1,f2,1);
  const u=d>0?[f0/d,f1/d,f2/d]:[0,0,0];
  const passes=[[210/45,'45次票(210元)'],[270/60,'60次票(270元)'],[390/90,'90次票(390元)']];
  let passHtml=passes.map(([cost,name])=>{
    const diff=cost-f0;
    const s=diff<=0?`<span class="same">省 ${fmt(-diff)} 元</span>`:`<span class="up">+${fmt(diff)} 元</span>`;
    return `<tr><td>${name}</td><td>${cost.toFixed(2)} 元/次</td><td>${s}</td></tr>`;
  }).join('');
  document.getElementById('resCard').classList.remove('hidden');
  document.getElementById('resTag').textContent=tag;
  document.getElementById('resBody').innerHTML=`
    <div class="route">
      <span class="od">${title}</span>
      <span class="dist">乘距约 ${fmt(d)} 公里</span>
      <span class="range">所属乘距档：${findRange(d)} 公里</span>
    </div>
    <div class="cards3">
      <div class="pcard cur"><div class="pname">现行票价</div><div class="pval">${f0} 元</div><div class="psub" style="color:#64748b">基准</div></div>
      <div class="pcard p1"><div class="pname">方案一</div><div class="pval">${f1} 元</div><div class="psub ${f1-f0?'up':'same'}">${f1-f0?'较现行 +'+fmt(f1-f0)+' 元':'持平'}</div></div>
      <div class="pcard p2"><div class="pname">方案二</div><div class="pval">${f2} 元</div><div class="psub ${f2-f0?'up':'same'}">${f2-f0?'较现行 +'+fmt(f2-f0)+' 元':'持平'}</div></div>
    </div>
    <div class="barwrap">
      <div class="brow"><span class="bl">现行</span><span class="bt"><i style="width:${f0/max*100}%;background:#94a3b8"></i></span><span class="bv">${f0} 元</span></div>
      <div class="brow"><span class="bl">方案一</span><span class="bt"><i style="width:${f1/max*100}%;background:#1d4ed8"></i></span><span class="bv">${f1} 元</span></div>
      <div class="brow"><span class="bl">方案二</span><span class="bt"><i style="width:${f2/max*100}%;background:#d97706"></i></span><span class="bv">${f2} 元</span></div>
    </div>
    <table>
      <tr><th style="width:28%">项目</th><th>现行</th><th>方案一</th><th>方案二</th></tr>
      <tr><td>票价（元）</td><td>${f0}</td><td>${f1}</td><td>${f2}</td></tr>
      <tr><td>较现行变化</td><td>—</td><td>${f1-f0?'<span class="up">+'+fmt(f1-f0)+'（+'+fmt((f1-f0)/f0*100)+'%）</span>':'持平'}</td><td>${f2-f0?'<span class="up">+'+fmt(f2-f0)+'（+'+fmt((f2-f0)/f0*100)+'%）</span>':'持平'}</td></tr>
      <tr><td>每人公里单价（元/km）</td><td>${u[0].toFixed(3)}</td><td>${u[1].toFixed(3)}</td><td>${u[2].toFixed(3)}</td></tr>
    </table>
    <h2 style="margin-top:16px;font-size:14px">计次票参考 <span class="tag">30日内有效</span></h2>
    <p class="passhint">本次行程现行票价 ${f0} 元；单次成本高于计次票单价时，购买对应计次票更划算。</p>
    <table><tr><th>计次票</th><th>单次成本</th><th>本次行程折算较现行</th></tr>${passHtml}</table>`;
}

/* ---- 渲染附件1对照表 ---- */
function renderFareTable(){
  let rows=TABLE.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
  document.getElementById('fareTable').innerHTML=`
    <table style="margin-top:10px">
      <tr><th>乘距范围（公里）</th><th>现状（元）</th><th>方案一（元）</th><th>方案二（元）</th></tr>
      ${rows}
    </table>`;
}

/* ---- 初始化 ---- */
fillLineOptions();
document.getElementById('lineA').value='1号线';
document.getElementById('lineB').value='2号线';
fillStations('A');fillStations('B');
document.getElementById('stnA').value='人民广场';
document.getElementById('stnB').value='浦东国际机场';
renderFareTable();
compute();
</script>
</body>
</html>
