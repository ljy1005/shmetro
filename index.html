<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上海地铁新票价对比计算器</title>
<meta name="description" content="上海地铁新票价对比计算器已上线小红书小工具平台，现行 vs 方案一 vs 方案二，多花多少一目了然。" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root{
    --bg: #0a1128;
    --blue: #2b5cff;
    --orange: #e8842c;
    --green: #7fd0a0;
    --red: #ff2442;
    --text: #f3f6ff;
  }

  html,body{ height:100%; }
  body{
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  /* 背景光晕 */
  body::before{
    content:"";
    position: fixed; inset: 0;
    background:
      radial-gradient(700px 340px at 12% -5%, rgba(43,92,255,.20), transparent 60%),
      radial-gradient(700px 340px at 88% 0%, rgba(232,132,44,.14), transparent 60%),
      radial-gradient(900px 420px at 50% 108%, rgba(43,92,255,.12), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  /* 顶部装饰地铁线路 */
  .lines{
    position:absolute; top:0; left:0; width:100%; height:230px;
    pointer-events:none; z-index:0; opacity:.75;
  }

  .page{
    position:relative; z-index:1;
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 20px 60px;
    text-align:center;
  }

  /* 词组防折断保护 */
  .nw{ white-space: nowrap; }
  /* 仅移动端生效的换行 */
  .br-m{ display:none; }

  /* ===== 头部 ===== */
  .badge{
    display:inline-block;
    background: linear-gradient(135deg,#1d4ed8,#2b5cff);
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 15px;
    letter-spacing: 2px;
    box-shadow: 0 4px 18px rgba(43,92,255,.45);
  }

  /* 标题：两行独立控字号，移动端 8 字一行完整显示 */
  h1{
    margin: 20px 0 12px;
    font-weight: 900;
    line-height: 1.22;
    letter-spacing: 1px;
  }
  h1 span{
    display:block;
    background: linear-gradient(180deg,#ffffff 30%,#9db9ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(43,92,255,.30);
  }
  h1 .t1{ font-size: clamp(30px, 9.2vw, 64px); }
  h1 .t2{ font-size: clamp(21px, 7.6vw, 58px); white-space: nowrap; }

  .sub{
    font-size: clamp(14px, 2.6vw, 20px);
    font-weight: 700;
    color: #ffd9ad;
    letter-spacing: 1px;
    text-wrap: balance;
  }
  .chips{ margin-top:18px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .chip{
    padding:6px 18px; border-radius:999px; font-size:14px; font-weight:700;
    border:1px solid rgba(255,255,255,.25);
  }
  .chip-gray{ background:#8a94a8; color:#101a3a; }
  .chip-blue{ background:var(--blue); color:#fff; }
  .chip-orange{ background:var(--orange); color:#fff; }

  /* ===== 公告文字 ===== */
  .notice{
    margin: 26px auto 0;
    max-width: 640px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: rgba(43,92,255,.14);
    border: 1px dashed rgba(125,160,255,.55);
    border-radius: 16px;
    padding: 14px 22px;
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: 700;
    color: #dbe6ff;
    text-wrap: balance;
  }
  .notice .dot{
    flex:0 0 auto; width:10px; height:10px; border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(127,208,160,.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(127,208,160,.7); }
    70%{ box-shadow:0 0 0 12px rgba(127,208,160,0); }
    100%{ box-shadow:0 0 0 0 rgba(127,208,160,0); }
  }

  /* ===== 小红书入口链接 ===== */
  .cta{
    margin: 16px auto 0;
    display:flex; align-items:center; gap:16px;
    max-width: 560px;
    padding: 16px 22px;
    border-radius: 20px;
    text-decoration:none;
    color:#fff;
    background: linear-gradient(135deg,#ff5c7a 0%, var(--red) 55%, #d1153a 100%);
    box-shadow: 0 12px 34px rgba(255,36,66,.38), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .25s ease, box-shadow .25s ease;
    text-align:left;
  }
  .cta:hover{
    transform: translateY(-4px);
    box-shadow: 0 18px 44px rgba(255,36,66,.5), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .cta-icon{
    flex:0 0 auto;
    width:58px; height:58px; border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .cta-text{ flex:1 1 auto; display:flex; flex-direction:column; gap:4px; min-width: 0; }
  .cta-text strong{ font-size: clamp(15px, 2.6vw, 20px); letter-spacing:1px; }
  .cta-text small{ font-size:13px; opacity:.9; letter-spacing:1px; }
  .cta-arrow{ flex:0 0 auto; display:flex; }
  .cta:hover .cta-arrow{ animation: nudge .6s infinite alternate; }
  @keyframes nudge{ from{ transform:translateX(0);} to{ transform:translateX(5px);} }

  /* ===== 应用截图 ===== */
  .poster{
    margin: 28px auto 0;
    max-width: 480px;
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(43,92,255,.12);
    background: #0d1531;
  }
  .poster img{
    display:block; width:100%; height:auto;
    transition: transform .5s ease;
  }
  .poster:hover img{ transform: scale(1.02); }
  .poster .fallback{
    padding: 70px 30px;
    font-size: 22px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(160deg,#101a3a,#0d1531);
  }

  /* ===== 更新日志 ===== */
  .changelog{
    margin: 40px auto 0;
    max-width: 640px;
    text-align: left;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 18px 24px;
  }
  .changelog-title{
    font-size: 14px;
    font-weight: 700;
    color: #8fa0c5;
    margin-bottom: 12px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .changelog-title::before{
    content: "";
    display: inline-block;
    width: 4px; height: 14px;
    background: var(--blue);
    border-radius: 2px;
  }
  .changelog-text{
    font-size: 13px;
    line-height: 1.9;
    color: #95a5c8;
    letter-spacing: 0.5px;
  }
  .changelog-text .num{
    color: var(--green);
    font-weight: 800;
    margin-right: 6px;
  }
  .changelog-text .ver{
    color: #ffb46b;
    font-weight: 700;
  }

  footer{
    margin-top: 34px;
    font-size: 13px;
    color:#8fa0c5;
    letter-spacing: 2px;
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 520px){
    .page{ padding: 40px 16px 48px; }
    .lines{ height: 150px; }
    .br-m{ display:inline; }          /* 副标题移动端整齐两行 */
    .badge{ font-size: 13px; padding: 7px 18px; }
    h1{ letter-spacing: 0; margin: 16px 0 10px; }
    .sub{ letter-spacing: 0; }
    .chips{ gap: 8px; margin-top: 14px; }
    .chip{ padding: 5px 14px; font-size: 13px; }
    .notice{ padding: 12px 16px; gap: 8px; }
    /* 入口按钮紧凑化，保证标题单行完整 */
    .cta{ padding: 14px 16px; gap: 12px; }
    .cta-icon{ width: 46px; height: 46px; }
    .cta-icon svg{ width: 27px; height: 27px; }
    .cta-text{ gap: 3px; }
    .cta-text strong{ font-size: 15px; letter-spacing: 0; }
    .cta-text small{ font-size: 12px; letter-spacing: 0; }
    .cta-arrow svg{ width: 22px; height: 22px; }
    .poster{ border-radius: 20px; }
    .changelog{ padding: 16px 18px; }
  }
</style>
</head>
<body>
